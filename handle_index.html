<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Трекер привычек</title>
  <!-- Обязательный скрипт Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Используем встроенные переменные темы Telegram, чтобы приложение выглядело "нативно" */
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #999999);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 80px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 16px;
    }

    .empty {
      text-align: center;
      color: var(--hint);
      padding: 40px 20px;
      font-size: 15px;
    }

    .habit {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--secondary-bg);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .habit-info { flex: 1; }

    .habit-name { font-size: 16px; font-weight: 500; }

    .habit-streak {
      font-size: 13px;
      color: var(--hint);
      margin-top: 2px;
    }

    .check-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--button);
      background: transparent;
      color: var(--button);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .check-btn.done {
      background: var(--button);
      color: var(--button-text);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--hint);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    /* Нижняя панель для добавления */
    .add-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--secondary-bg);
    }

    .add-bar input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--secondary-bg);
      background: var(--secondary-bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .add-bar button {
      padding: 0 20px;
      border-radius: 10px;
      border: none;
      background: var(--button);
      color: var(--button-text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-bar button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>Мои привычки</h1>

  <div id="list">
    <div class="empty">Загрузка...</div>
  </div>

  <div class="add-bar">
    <input id="newHabit" type="text" placeholder="Новая привычка..." maxlength="60" />
    <button id="addBtn">+</button>
  </div>

  <script>
    // 1. Инициализация Telegram Mini App
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // раскрываем на весь экран

    // 2. Ключ для хранения в CloudStorage
    const STORAGE_KEY = "habits_v1";

    // 3. Загрузка привычек из облака Telegram
    function loadHabits(callback) {
      tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
        if (err || !value) {
          callback([]);
        } else {
          try {
            callback(JSON.parse(value));
          } catch (e) {
            callback([]);
          }
        }
      });
    }

    // 4. Сохранение привычек в облако
    function saveHabits(habits, callback) {
      tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify(habits), callback);
    }

    // 5. Форматирование даты в вид "2026-11-03"
    function todayStr() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    // 6. Подсчёт текущей серии (сколько дней подряд отмечено)
    function calcStreak(history) {
      if (!history || history.length === 0) return 0;
      const sorted = [...history].sort().reverse();
      const today = todayStr();
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);

      // Серия актуальна, только если отмечено сегодня или вчера
      if (sorted[0] !== today && sorted[0] !== yesterday) return 0;

      let streak = 1;
      for (let i = 1; i < sorted.length; i++) {
        const prev = new Date(sorted[i - 1]);
        const cur = new Date(sorted[i]);
        const diff = (prev - cur) / 86400000;
        if (diff === 1) streak++;
        else break;
      }
      return streak;
    }

    // 7. Отрисовка списка привычек
    let habits = [];

    function render() {
      const list = document.getElementById("list");
      if (habits.length === 0) {
        list.innerHTML = '<div class="empty">Пока пусто. Добавьте первую привычку 👇</div>';
        return;
      }

      const today = todayStr();
      list.innerHTML = "";

      habits.forEach((habit, index) => {
        const done = habit.history.includes(today);
        const streak = calcStreak(habit.history);

        const el = document.createElement("div");
        el.className = "habit";
        el.innerHTML = `
          <div class="habit-info">
            <div class="habit-name">${escapeHtml(habit.name)}</div>
            <div class="habit-streak">
              ${streak > 0 ? `🔥 ${streak} ${plural(streak, "день", "дня", "дней")} подряд` : "Ещё не начато"}
            </div>
          </div>
          <button class="check-btn ${done ? "done" : ""}" data-index="${index}">
            ${done ? "✓" : ""}
          </button>
          <button class="delete-btn" data-delete="${index}">✕</button>
        `;
        list.appendChild(el);
      });

      // Обработчики кнопок
      document.querySelectorAll(".check-btn").forEach(btn => {
        btn.addEventListener("click", () => toggleToday(+btn.dataset.index));
      });
      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", () => deleteHabit(+btn.dataset.delete));
      });
    }

    // 8. Отметка/снятие отметки на сегодня
    function toggleToday(index) {
      const habit = habits[index];
      const today = todayStr();
      const pos = habit.history.indexOf(today);

      if (pos === -1) habit.history.push(today);
      else habit.history.splice(pos, 1);

      saveHabits(habits, () => render());
    }

    // 9. Удаление привычки
    function deleteHabit(index) {
      if (!confirm("Удалить эту привычку?")) return;
      habits.splice(index, 1);
      saveHabits(habits, () => render());
    }

    // 10. Добавление новой привычки
    function addHabit() {
      const input = document.getElementById("newHabit");
      const name = input.value.trim();
      if (!name) return;

      habits.push({ name, history: [] });
      input.value = "";
      saveHabits(habits, () => render());
    }

    // 11. Утилиты
    function plural(n, one, few, many) {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return one;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
      return many;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    // 12. Старт
    document.getElementById("addBtn").addEventListener("click", addHabit);
    document.getElementById("newHabit").addEventListener("keydown", e => {
      if (e.key === "Enter") addHabit();
    });

    loadHabits(data => {
      habits = data;
      render();
    });
  </script>
</body>
</html>
